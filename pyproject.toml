[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evo2-distill"
version = "0.1.0"
description = "Validation-only Phase 4.5 infrastructure for Evo 2 genomic distillation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<21",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "torch>=2.4,<3",
  "tqdm>=4.66,<5",
  "pyyaml>=6,<7",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2",
  "psutil>=5.9,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

